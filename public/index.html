<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRM 7Bee</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐝</text></svg>" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span aria-hidden="true">🐝</span> CRM 7Bee</div>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="triagem" role="tab">Triagem de mensagens</button>
    <button class="tab" data-view="contatos" role="tab">Contatos</button>
    <button class="tab" data-view="painel" role="tab">Painel</button>
  </nav>
  <button class="btn btn-ghost" id="refresh" title="Atualizar dados">Atualizar</button>
</header>

<main>
  <!-- ------------------------------- TRIAGEM ------------------------------- -->
  <section id="view-triagem" class="view">
    <div class="kpis" id="kpis"></div>

    <div class="toolbar">
      <div class="chips" id="status-chips">
        <button class="chip is-active" data-view="precisa">Precisam de você</button>
        <button class="chip" data-view="aguardando">Aguardando o agente</button>
        <button class="chip" data-view="auto">Respondidas pelo agente</button>
        <button class="chip" data-view="respondidas">Respondidas por você</button>
        <button class="chip" data-view="arquivadas">Descartadas</button>
        <button class="chip" data-view="todas">Todas</button>
      </div>
      <div class="filters">
        <input type="search" id="msg-search" placeholder="Buscar texto ou remetente…" />
        <select id="msg-priority">
          <option value="">Toda prioridade</option>
          <option value="alta">Alta</option>
          <option value="media">Média</option>
          <option value="baixa">Baixa</option>
        </select>
        <select id="msg-channel">
          <option value="">Todo canal</option>
          <option value="whatsapp">WhatsApp</option>
          <option value="email">E-mail</option>
          <option value="instagram">Instagram</option>
          <option value="site">Site</option>
          <option value="telefone">Telefone</option>
          <option value="chat">Chat</option>
          <option value="outro">Outro</option>
        </select>
        <select id="msg-sort">
          <option value="score">Ordenar por relevância</option>
          <option value="recente">Ordenar por mais recente</option>
        </select>
        <button class="btn" id="new-message">+ Registrar mensagem</button>
      </div>
    </div>

    <div id="msg-list" class="cards"></div>
  </section>

  <!-- ------------------------------ CONTATOS ------------------------------ -->
  <section id="view-contatos" class="view is-hidden">
    <div class="toolbar">
      <div class="filters">
        <input type="search" id="contact-search" placeholder="Buscar contato, empresa, e-mail…" />
        <select id="contact-stage">
          <option value="">Toda etapa</option>
          <option value="lead">Lead</option>
          <option value="qualificado">Qualificado</option>
          <option value="proposta">Proposta</option>
          <option value="cliente">Cliente</option>
          <option value="perdido">Perdido</option>
        </select>
        <button class="btn" id="new-contact">+ Novo contato</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="table" id="contact-table">
        <thead>
          <tr><th>Nome</th><th>Empresa</th><th>Contato</th><th>Etapa</th><th>Responsável</th><th>Cliente</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- ------------------------------- PAINEL ------------------------------- -->
  <section id="view-painel" class="view is-hidden">
    <div class="kpis" id="kpis-panel"></div>
    <div class="panel-grid">
      <div class="card">
        <h3>Mensagens abertas por canal</h3>
        <div id="chart-channel" class="bars"></div>
      </div>
      <div class="card">
        <h3>Contatos por etapa</h3>
        <div id="chart-stage" class="bars"></div>
      </div>
      <div class="card">
        <h3>O que o agente fez com as mensagens</h3>
        <div id="chart-agent" class="bars"></div>
      </div>
      <div class="card">
        <h3>Como o time avaliou o agente</h3>
        <div id="chart-feedback" class="bars"></div>
      </div>
    </div>
  </section>
</main>

<dialog id="modal">
  <form method="dialog" id="modal-form">
    <h2 id="modal-title">Título</h2>
    <div id="modal-body" class="form-grid"></div>
    <footer class="modal-actions">
      <button class="btn btn-ghost" value="cancel" formnovalidate>Cancelar</button>
      <button class="btn btn-primary" value="confirm" id="modal-confirm">Salvar</button>
    </footer>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
