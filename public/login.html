<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar · CRM 7Bee</title>
<link rel="icon" type="image/webp" href="/assets/abelha.webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/components.css" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: var(--space-4);
    background: radial-gradient(900px 500px at 0% 0%, var(--bg-aura), transparent 60%), var(--bg);
    color: var(--ink); font: 400 14px/22px var(--font-sans); -webkit-font-smoothing: antialiased; }
  .login { width: min(380px, 100%); display: grid; gap: var(--space-5); padding: var(--space-8) var(--space-6);
    background: var(--sheen), var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
  .login__marca { display: flex; align-items: center; gap: var(--space-3); }
  .login__marca img { width: 44px; height: 44px; object-fit: contain; }
  .login__marca small { display: block; font: 600 11px/14px var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--accent-text); }
  .login h1 { margin: 0; font: 700 22px/28px var(--font-display); }
  .login form { display: grid; gap: var(--space-4); }
  .login label { display: grid; gap: var(--space-1); font: 600 12px/16px var(--font-sans); color: var(--ink-muted); }
  .login .sb-field { height: 42px; font-size: 14px; }
  .login .sb-btn { height: 42px; justify-content: center; font-size: 14px; }
  .login__erro { min-height: 20px; margin: 0; color: var(--danger); font: 500 13px/20px var(--font-sans); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
</style>
</head>
<body class="sb">
<main class="login">
  <div class="login__marca">
    <img src="/assets/abelha.webp" alt="" />
    <div><small>7Bee.ai</small><h1>CRM 7Bee</h1></div>
  </div>
  <form id="form" novalidate>
    <label>E-mail
      <input class="sb-field" type="email" name="email" autocomplete="username" required autofocus />
    </label>
    <label>Senha
      <input class="sb-field" type="password" name="senha" autocomplete="current-password" required />
    </label>
    <p class="login__erro" id="erro" role="alert"></p>
    <button class="sb-btn sb-btn--primary" type="submit" id="entrar">Entrar</button>
  </form>
</main>
<script>
  try { const t = localStorage.getItem('crm7bee-tema'); if (t) document.documentElement.dataset.theme = t; } catch {}
  const form = document.getElementById('form');
  const erro = document.getElementById('erro');
  const botao = document.getElementById('entrar');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erro.textContent = '';
    const dados = Object.fromEntries(new FormData(form));
    if (!dados.email || !dados.senha) { erro.textContent = 'Preencha e-mail e senha.'; return; }
    botao.disabled = true; botao.textContent = 'Entrando…';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(dados) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Não foi possível entrar.');
      location.replace('/');
    } catch (err) {
      erro.textContent = err.message;
      botao.disabled = false; botao.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
